name: Run unit tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # verified combination, see docs/dependencies.md
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Run dependency and metadata tests
        run: |
          python -m unittest discover -s tests -p test_dependencies.py -v
          python -m unittest discover -s tests -p test_metadata.py -v

      # The legacy suite patches library functions globally and has known failures,
      # so it does not block the build yet.
      - name: Run full test suite
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -v
